<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viziahub Pro - Multi-Project Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen p-4 flex flex-col justify-between">

    <div class="max-w-xl mx-auto w-full space-y-6">
        <!-- Header -->
        <div class="flex justify-between items-center border-b border-gray-800 pb-4">
            <h1 class="text-xl font-black text-cyan-400 tracking-wider">VIZIAHUB <span class="text-white text-xs bg-emerald-900 px-2 py-1 rounded">PROJECT VAULT</span></h1>
            <button onclick="toggleSettings()" class="bg-gray-900 border border-gray-800 text-xs px-3 py-2 rounded-lg hover:bg-gray-800 text-cyan-400 font-bold flex items-center gap-1">
                ⚙️ Settings & Projects
            </button>
        </div>

        <!-- Prompt Box -->
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 shadow-2xl space-y-4">
            <div>
                <label class="block text-xs uppercase tracking-widest text-cyan-400 font-bold mb-1">🧠 Project Name</label>
                <input type="text" id="projectNameInput" placeholder="e.g. Smart Calculator" class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-sm text-cyan-200 focus:outline-none focus:border-cyan-500 placeholder-gray-600 mb-3">
                
                <label class="block text-xs uppercase tracking-widest text-cyan-400 font-bold mb-1">🧠 Hybrid App Prompt / Instructions</label>
                <textarea id="promptInput" rows="3" class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-sm text-cyan-200 focus:outline-none focus:border-cyan-500 placeholder-gray-600" placeholder="e.g. Build a fully functional smart calculator app..."></textarea>
            </div>
            
            <div class="flex flex-col gap-2">
                <button onclick="generateHybridAppPackage()" id="buildBtn" class="w-full bg-gradient-to-r from-cyan-500 to-emerald-500 hover:from-cyan-400 hover:to-emerald-400 text-gray-950 font-bold py-3.5 rounded-xl transition duration-200 text-sm shadow-lg shadow-cyan-500/20">
                    ⚡ Run AI Agent & Save Project Vault
                </button>
                
                <!-- Action Buttons -->
                <div class="grid grid-cols-1 gap-2 pt-1">
                    <button onclick="launchPreview()" id="previewActionBtn" class="hidden w-full bg-gray-950 border border-cyan-500/40 hover:bg-cyan-950/30 text-cyan-400 font-semibold py-2.5 rounded-xl text-xs transition">
                        👁️ Test Live HTML Preview
                    </button>
                    
                    <button onclick="copyWebLink()" id="copyLinkBtn" class="hidden w-full bg-cyan-950/50 border border-cyan-500 text-cyan-300 hover:bg-cyan-900 font-bold py-2.5 rounded-xl transition duration-200 text-xs text-center">
                        🔗 Copy Instant Web Link (Blob URL)
                    </button>
                </div>
            </div>
        </div>

        <!-- Status Area -->
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 text-center space-y-3">
            <p id="statusText" class="text-xs text-cyan-300 font-mono">Idle - Agent Standing By</p>
            
            <!-- Progress Bar -->
            <div class="w-full bg-gray-950 h-3 rounded-full overflow-hidden border border-gray-800">
                <div id="myProgressBar" class="bg-gradient-to-r from-cyan-500 to-emerald-500 h-full w-0 transition-all duration-300"></div>
            </div>
        </div>
    </div>

    <!-- Settings & Project Vault Modal -->
    <div id="settingsModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-gray-900 border border-gray-700 p-6 rounded-3xl w-full max-w-lg space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-gray-800 pb-2">
                <h2 class="text-lg font-bold text-white">API & Project Vault</h2>
                <button onclick="toggleSettings()" class="text-gray-400 hover:text-white text-sm">✕</button>
            </div>
            
            <div class="space-y-4 text-left">
                <div>
                    <label class="text-[10px] uppercase text-gray-400 font-bold">Groq API Key</label>
                    <input type="password" id="m_groq" placeholder="gsk_..." class="w-full bg-gray-950 p-2.5 rounded-lg border border-gray-700 text-sm text-white">
                </div>

                <!-- Saved Projects Vault Section -->
                <div class="border-t border-gray-800 pt-3">
                    <h3 class="text-xs uppercase text-cyan-400 font-bold mb-2">📂 Saved Projects & Vault Files</h3>
                    <div id="projectListContainer" class="space-y-2 max-h-48 overflow-y-auto pr-1">
                        <p class="text-xs text-gray-500">No projects saved yet.</p>
                    </div>
                </div>

                <!-- Selected Project File Viewer (Only index.html + VIP Copy Button) -->
                <div id="projectDetailView" class="hidden border-t border-gray-800 pt-3 space-y-2">
                    <div class="flex justify-between items-center">
                        <h4 id="detailProjectTitle" class="text-xs font-bold text-emerald-400"></h4>
                        <button onclick="copyActiveCode()" id="vipCopyBtn" class="bg-gradient-to-r from-cyan-500 to-emerald-500 hover:from-cyan-400 hover:to-emerald-400 text-gray-950 font-bold px-3 py-1 rounded-lg text-xs shadow-md transition flex items-center gap-1">
                            📋 Copy Code
                        </button>
                    </div>
                    
                    <div class="space-y-1 text-xs">
                        <div class="w-full bg-gray-950 p-2 rounded border border-gray-800 text-left text-cyan-300 flex justify-between items-center">
                            <span>📄 index.html</span>
                            <span class="text-[10px] text-emerald-400 bg-emerald-950/50 px-2 py-0.5 rounded border border-emerald-800">Active File</span>
                        </div>
                    </div>
                    
                    <textarea id="fileViewerCode" rows="8" readonly class="w-full bg-gray-950 font-mono text-[10px] text-gray-300 p-3 rounded-xl border border-gray-800 mt-2 select-all focus:outline-none focus:border-cyan-500" placeholder="Select a project above to view code..."></textarea>
                </div>
            </div>
            
            <div class="flex gap-2 pt-2 border-t border-gray-800">
                <button onclick="toggleSettings()" class="flex-1 bg-gray-800 hover:bg-gray-700 py-2.5 rounded-xl text-sm font-semibold text-gray-300">Close</button>
                <button onclick="saveSettings()" class="flex-1 bg-cyan-600 hover:bg-cyan-500 py-2.5 rounded-xl text-sm font-bold text-white shadow-lg shadow-cyan-600/20">Save API Key</button>
            </div>
        </div>
    </div>

    <!-- Footer Note -->
    <footer class="text-center text-gray-600 text-[10px] mt-6">
        Viziahub Vault Engine • 10,000 Crore Vision Edition
    </footer>

    <script>
        const SELECTED_MODEL = "llama-3.3-70b-versatile";

        let groqApiKey = localStorage.getItem('viziahub_groq_key') || '';
        let projectsVault = JSON.parse(localStorage.getItem('viz_projects_vault') || '{}');
        let currentActiveProject = localStorage.getItem('viz_active_project') || '';
        let generatedBlobUrl = "";

        if(currentActiveProject && projectsVault[currentActiveProject]) {
            document.getElementById('statusText').innerText = `Loaded active project: "${currentActiveProject}"`;
            document.getElementById('previewActionBtn').classList.remove('hidden');
            document.getElementById('copyLinkBtn').classList.remove('hidden');
            createBlobUrl(projectsVault[currentActiveProject].indexHtml);
        }

        function toggleSettings() {
            const modal = document.getElementById('settingsModal');
            modal.classList.toggle('hidden');
            if(!modal.classList.contains('hidden')) {
                document.getElementById('m_groq').value = localStorage.getItem('viziahub_groq_key') || '';
                renderProjectList();
            }
        }

        function saveSettings() {
            localStorage.setItem('viziahub_groq_key', document.getElementById('m_groq').value.trim());
            groqApiKey = localStorage.getItem('viziahub_groq_key');
            alert("API Key Saved Successfully!");
        }

        function createBlobUrl(htmlContent) {
            const blob = new Blob([htmlContent], { type: 'text/html' });
            generatedBlobUrl = URL.createObjectURL(blob);
        }

        function copyWebLink() {
            if(!generatedBlobUrl) return alert("Pehle app generate karo bhai!");
            navigator.clipboard.writeText(generatedBlobUrl);
            alert("🔗 Instant Web Link Copied!");
        }

        // VIP Copy Code Functionality
        function copyActiveCode() {
            const codeBox = document.getElementById('fileViewerCode');
            if(!codeBox.value) return alert("Copy karne ke liye koi code nahi hai bhai!");
            
            navigator.clipboard.writeText(codeBox.value).then(() => {
                const btn = document.getElementById('vipCopyBtn');
                btn.innerHTML = "✅ Copied!";
                btn.className = "bg-emerald-500 text-gray-950 font-bold px-3 py-1 rounded-lg text-xs shadow-md transition flex items-center gap-1";
                setTimeout(() => {
                    btn.innerHTML = "📋 Copy Code";
                    btn.className = "bg-gradient-to-r from-cyan-500 to-emerald-500 hover:from-cyan-400 hover:to-emerald-400 text-gray-950 font-bold px-3 py-1 rounded-lg text-xs shadow-md transition flex items-center gap-1";
                }, 2000);
            }).catch(err => {
                alert("Copy karne mein error aaya!");
            });
        }

        function renderProjectList() {
            const container = document.getElementById('projectListContainer');
            const keys = Object.keys(projectsVault);
            if(keys.length === 0) {
                container.innerHTML = `<p class="text-xs text-gray-500">No projects saved yet.</p>`;
                return;
            }
            container.innerHTML = "";
            keys.forEach(projectName => {
                const div = document.createElement('div');
                div.className = "flex justify-between items-center bg-gray-950 p-2 rounded-lg border border-gray-800 text-xs";
                div.innerHTML = `
                    <span class="text-cyan-300 font-semibold">📁 ${projectName}</span>
                    <div class="flex gap-1">
                        <button onclick="loadProject('${projectName}')" class="bg-cyan-600 hover:bg-cyan-500 px-2 py-1 rounded text-white font-bold">Open</button>
                        <button onclick="deleteProject('${projectName}')" class="bg-red-900/50 hover:bg-red-900 px-2 py-1 rounded text-red-300">Del</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        let viewingProjectData = null;
        function loadProject(name) {
            currentActiveProject = name;
            localStorage.setItem('viz_active_project', name);
            viewingProjectData = projectsVault[name];
            
            document.getElementById('projectDetailView').classList.remove('hidden');
            document.getElementById('detailProjectTitle').innerText = `Active Vault Files: ${name}`;
            document.getElementById('fileViewerCode').value = viewingProjectData.indexHtml;
            
            document.getElementById('statusText').innerText = `Switched to project: "${name}"`;
            document.getElementById('previewActionBtn').classList.remove('hidden');
            document.getElementById('copyLinkBtn').classList.remove('hidden');
            createBlobUrl(viewingProjectData.indexHtml);
            document.getElementById('projectNameInput').value = name;
        }

        function deleteProject(name) {
            if(confirm(`Delete project "${name}" from vault?`)) {
                delete projectsVault[name];
                localStorage.setItem('viz_projects_vault', JSON.stringify(projectsVault));
                if(currentActiveProject === name) {
                    currentActiveProject = '';
                    localStorage.removeItem('viz_active_project');
                    document.getElementById('projectDetailView').classList.add('hidden');
                }
                renderProjectList();
            }
        }

        async function generateHybridAppPackage() {
            const projectName = document.getElementById('projectNameInput').value.trim() || "MyHybridApp";
            const promptText = document.getElementById('promptInput').value.trim();

            if(!promptText) {
                alert("Pehle app ka prompt daal bhai!");
                return;
            }
            if(!groqApiKey) {
                alert("Pehle ⚙️ Settings mein apni Groq API Key daal!");
                toggleSettings();
                return;
            }

            const status = document.getElementById('statusText');
            const buildBtn = document.getElementById('buildBtn');
            const progressBar = document.getElementById('myProgressBar');
            
            buildBtn.disabled = true;
            let width = 20;
            progressBar.style.width = width + "%";

            try {
                status.innerText = `🤖 Agent: Generating "${projectName}" index.html via Groq...`;
                width = 50; progressBar.style.width = width + "%";

                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${groqApiKey}` },
                    body: JSON.stringify({
                        model: SELECTED_MODEL,
                        messages: [
                            { role: "system", content: "You are an expert hybrid app developer. Create a fully self-contained, responsive single-file app using Tailwind CSS via CDN with internal JS logic. Output ONLY valid HTML starting with <!DOCTYPE html> and ending with </html>." },
                            { role: "user", content: promptText }
                        ],
                        temperature: 0.7,
                        max_tokens: 8192
                    })
                });

                const data = await response.json();
                if (data.error || !data.choices) {
                    throw new Error(data.error ? data.error.message : "Agent generation failed!");
                }

                const indexHtml = data.choices[0].message.content.replace(/```html/g, '').replace(/```[a-z]*/g, '').replace(/```/g, '').trim();

                // Save only index.html into Vault Storage
                projectsVault[projectName] = {
                    indexHtml: indexHtml
                };

                currentActiveProject = projectName;
                localStorage.setItem('viz_projects_vault', JSON.stringify(projectsVault));
                localStorage.setItem('viz_active_project', projectName);

                createBlobUrl(indexHtml);

                width = 100; progressBar.style.width = width + "%";
                status.innerText = `✅ Success! Project "${projectName}" saved in Vault.`;
                
                document.getElementById('previewActionBtn').classList.remove('hidden');
                document.getElementById('copyLinkBtn').classList.remove('hidden');

            } catch (error) {
                console.error(error);
                status.innerText = "❌ Error: " + error.message;
            } finally {
                buildBtn.disabled = false;
            }
        }

        function launchPreview() {
            if(!currentActiveProject || !projectsVault[currentActiveProject]) return alert("No active project found!");
            const win = window.open();
            win.document.write(projectsVault[currentActiveProject].indexHtml);
            win.document.close();
        }
    </script>
</body>
</html>
