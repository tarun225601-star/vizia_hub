<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viziahub Pro - Groq Android Wrapper Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- JSZip CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen p-4 flex flex-col justify-between">

    <div class="max-w-xl mx-auto w-full space-y-6">
        <!-- Header -->
        <div class="flex justify-between items-center border-b border-gray-800 pb-4">
            <h1 class="text-2xl font-black text-cyan-400 tracking-wider">VIZIAHUB <span class="text-white text-xs bg-cyan-900 px-2 py-1 rounded">GROQ WRAPPER</span></h1>
            <button onclick="openSettings()" class="bg-gray-900 border border-gray-800 text-xs px-3 py-2 rounded-lg hover:bg-gray-800 text-gray-300">⚙️ Groq API Settings</button>
        </div>

        <!-- Prompt Box -->
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 shadow-2xl space-y-4">
            <label class="block text-xs uppercase tracking-widest text-gray-400 font-bold">App Idea Prompt</label>
            <textarea id="promptInput" rows="4" class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-sm text-cyan-200 focus:outline-none focus:border-cyan-500 placeholder-gray-600" placeholder="e.g. Make simple calculator app..."></textarea>
            
            <div class="flex gap-2">
                <button onclick="generateAndroidPackage()" id="buildBtn" class="flex-1 bg-cyan-500 hover:bg-cyan-400 text-gray-950 font-bold py-3 rounded-xl transition duration-200 text-sm shadow-lg shadow-cyan-500/20">
                    🚀 Build Full Android Package
                </button>
                <button onclick="downloadAndroidZip()" id="downloadBtn" disabled class="bg-gray-800 text-gray-500 font-bold px-5 py-3 rounded-xl transition duration-200 text-sm border border-gray-700 cursor-not-allowed">
                    📦 Download Android ZIP
                </button>
            </div>
        </div>

        <!-- Status & Preview Area -->
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 text-center">
            <p id="statusText" class="text-xs text-gray-400 font-mono mb-3">Ready via Groq API</p>
            <div id="previewContainer" class="hidden">
                <button onclick="launchPreview()" class="w-full bg-gray-950 border border-cyan-500/40 hover:bg-cyan-950/30 text-cyan-400 font-semibold py-2.5 rounded-xl text-xs transition">
                    👁️ Test Live App Preview
                </button>
            </div>
        </div>
    </div>

    <!-- Footer Note -->
    <footer class="text-center text-gray-600 text-[10px] mt-6">
        Viziahub Native Wrapper Engine • Groq Cloud Integrated
    </footer>

    <script>
        let groqApiKey = localStorage.getItem('viziahub_groq_key') || '';
        let appFiles = {
            indexHtml: localStorage.getItem('viz_index') || '',
            manifestJson: localStorage.getItem('viz_manifest') || '',
            swJs: localStorage.getItem('viz_sw') || '',
            androidManifest: localStorage.getItem('viz_android_manifest') || '',
            mainActivity: localStorage.getItem('viz_main_activity') || '',
            buildGradle: localStorage.getItem('viz_gradle') || ''
        };

        if(appFiles.indexHtml) {
            document.getElementById('statusText').innerText = "Last built Android package loaded from memory!";
            document.getElementById('previewContainer').classList.remove('hidden');
            enableDownloadButton();
        }

        function openSettings() {
            const key = prompt("Enter your Groq API Key:", groqApiKey);
            if(key !== null) {
                groqApiKey = key.trim();
                localStorage.setItem('viziahub_groq_key', groqApiKey);
                alert("Groq API Key Saved Successfully!");
            }
        }

        function enableDownloadButton() {
            const dlBtn = document.getElementById('downloadBtn');
            dlBtn.disabled = false;
            dlBtn.className = "bg-cyan-600 hover:bg-cyan-500 text-white font-bold px-5 py-3 rounded-xl transition duration-200 text-sm border border-cyan-500 cursor-pointer shadow-lg shadow-cyan-600/20";
        }

        async function generateAndroidPackage() {
            const promptText = document.getElementById('promptInput').value.trim();
            if(!promptText) {
                alert("Pehle prompt toh daal bhai!");
                return;
            }
            if(!groqApiKey) {
                alert("Pehle ⚙️ API Settings mein jaakar apni Groq API Key daal!");
                openSettings();
                return;
            }

            const status = document.getElementById('statusText');
            status.innerText = "Building via Groq Cloud Engine...";
            document.getElementById('buildBtn').disabled = true;

            const systemInstruction = "You are an expert mobile web application developer. Create a fully self-contained, responsive, high-performance HTML/JS application (using Tailwind CSS via CDN) based on the user request. Make it look like a real native mobile app. Output ONLY valid HTML code starting with <!DOCTYPE html> and ending with </html> without markdown code blocks.";

            try {
                // Correct Groq API Endpoint & Llama3 Model configuration
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${groqApiKey}`
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [
                            { role: "system", content: systemInstruction },
                            { role: "user", content: promptText }
                        ],
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                if(data.error) throw new Error(data.error.message || "Groq API Error");

                let rawHtml = data.choices[0].message.content;
                rawHtml = rawHtml.replace(/```html/g, '').replace(/```/g, '').trim();

                // 1. Web Files
                appFiles.indexHtml = rawHtml;
                appFiles.manifestJson = JSON.stringify({
                    "name": "Viziahub Native App",
                    "short_name": "VizApp",
                    "start_url": "index.html",
                    "display": "standalone",
                    "background_color": "#030712",
                    "theme_color": "#06b6d4",
                    "icons": [{"src": "icon.png", "sizes": "192x192", "type": "image/png"}]
                }, null, 2);

                appFiles.swJs = `
self.addEventListener('install', e => e.waitUntil(caches.open('viz-v1').then(c => c.addAll(['index.html', 'manifest.json']))));
self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));
                `.trim();

                // 2. Android Wrapper Files
                appFiles.androidManifest = `<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android"
    package="com.viziahub.app">
    <uses-permission android:name="android.permission.INTERNET" />
    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
    <application
        android:allowBackup="true"
        android:icon="@mipmap/ic_launcher"
        android:label="Viziahub App"
        android:roundIcon="@mipmap/ic_launcher_round"
        android:supportsRtl="true"
        android:theme="@style/Theme.AppCompat.NoActionBar">
        <activity
            android:name=".MainActivity"
            android:exported="true">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>
    </application>
</manifest>`;

                appFiles.mainActivity = `package com.viziahub.app;

import android.os.Bundle;
import android.webkit.WebSettings;
import android.webkit.WebView;
import android.webkit.WebViewClient;
import androidx.appcompat.app.AppCompatActivity;

public class MainActivity extends AppCompatActivity {
    private WebView webView;

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        webView = new WebView(this);
        WebSettings webSettings = webView.getSettings();
        webSettings.setJavaScriptEnabled(true);
        webSettings.setDomStorageEnabled(true);
        webSettings.setLoadWithOverviewMode(true);
        webSettings.setUseWideViewPort(true);
        
        webView.setWebViewClient(new WebViewClient());
        webView.loadUrl("file:///android_asset/index.html");
        setContentView(webView);
    }

    @Override
    public void onBackPressed() {
        if (webView.canGoBack()) {
            webView.goBack();
        } else {
            super.onBackPressed();
        }
    }
}`;

                appFiles.buildGradle = `plugins {
    id 'com.android.application'
}
android {
    compileSdk 34
    defaultConfig {
        applicationId "com.viziahub.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
}`;

                // Save to LocalStorage
                localStorage.setItem('viz_index', appFiles.indexHtml);
                localStorage.setItem('viz_manifest', appFiles.manifestJson);
                localStorage.setItem('viz_sw', appFiles.swJs);
                localStorage.setItem('viz_android_manifest', appFiles.androidManifest);
                localStorage.setItem('viz_main_activity', appFiles.mainActivity);
                localStorage.setItem('viz_gradle', appFiles.buildGradle);

                status.innerText = "Success! Complete Android Studio Project Wrapper Generated via Groq.";
                document.getElementById('previewContainer').classList.remove('hidden');
                enableDownloadButton();

            } catch (error) {
                console.error(error);
                status.innerText = "Error: " + error.message;
            } finally {
                document.getElementById('buildBtn').disabled = false;
            }
        }

        function launchPreview() {
            if(!appFiles.indexHtml) return alert("Pehle app build kar le!");
            const win = window.open();
            win.document.write(appFiles.indexHtml);
            win.document.close();
        }

        async function downloadAndroidZip() {
            if(!appFiles.indexHtml) return alert("Pehle app build toh kar!");
            
            const zip = new JSZip();
            const assetsFolder = zip.folder("app/src/main/assets");
            assetsFolder.file("index.html", appFiles.indexHtml);
            assetsFolder.file("manifest.json", appFiles.manifestJson);
            assetsFolder.file("sw.js", appFiles.swJs);

            const javaFolder = zip.folder("app/src/main/java/com/viziahub/app");
            javaFolder.file("MainActivity.java", appFiles.mainActivity);

            const manifestFolder = zip.folder("app/src/main");
            manifestFolder.file("AndroidManifest.xml", appFiles.androidManifest);

            const gradleFolder = zip.folder("app");
            gradleFolder.file("build.gradle", appFiles.buildGradle);

            zip.file("README.txt", "Viziahub Android Wrapper Package (Powered by Groq).\n1. Open this folder in Android Studio.\n2. Let Gradle sync.\n3. Click 'Build Bundle(s) / APK(s)' to get your 20MB Native APK!");

            const content = await zip.generateAsync({ type: "blob" });
            const url = URL.createObjectURL(content);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Viziahub_Groq_Android_Project.zip';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
