<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viziahub - AI App Factory</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; display: flex; height: 100vh; overflow: hidden; position: relative; }
        .settings-toggle-btn { position: fixed; top: 15px; left: 15px; background: #0284c7; color: white; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; z-index: 100; font-size: 14px; width: auto; }
        .sidebar { width: 300px; background: #1e293b; border-right: 1px solid #334155; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; height: 100vh; position: fixed; left: -300px; top: 0; transition: left 0.3s ease; z-index: 1000; }
        .sidebar.active { left: 0; }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .sidebar h2 { font-size: 18px; color: #38bdf8; margin: 0; }
        .close-btn { background: transparent; color: #f8fafc; border: none; font-size: 20px; cursor: pointer; width: auto; padding: 0; }
        .sidebar label { font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 5px; display: block; }
        .sidebar input { width: 100%; padding: 10px; margin-bottom: 15px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px; box-sizing: border-box; font-size: 13px; }
        .save-btn { background: #0284c7; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; width: 100%; }
        .save-btn:hover { background: #0369a1; }
        .main-container { flex: 1; padding: 20px; padding-top: 60px; overflow-y: auto; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; max-width: 900px; margin: 0 auto; width: 100%; }
        h1 { color: #38bdf8; text-align: center; margin-bottom: 20px; width: 100%; font-size: 22px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #cbd5e1; width: 100%; }
        textarea { width: 100%; padding: 12px; margin-bottom: 20px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px; box-sizing: border-box; height: 250px; font-family: monospace; }
        .ai-box { background: #1e293b; padding: 15px; border-radius: 8px; border: 1px solid #0284c7; margin-bottom: 20px; width: 100%; box-sizing: border-box; }
        .ai-box input { width: 100%; padding: 10px; margin-bottom: 10px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px; box-sizing: border-box; }
        button { background: #22c55e; color: white; border: none; padding: 14px; width: 100%; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        button:hover { background: #16a34a; }
        .ai-btn { background: #0284c7; width: auto; padding: 8px 16px; font-size: 14px; }
        #result { margin-top: 20px; text-align: center; font-weight: bold; width: 100%; }
    </style>
</head>
<body>

    <button class="settings-toggle-btn" onclick="toggleSettings()">⚙️ Settings</button>

    <div class="sidebar" id="sidebarPanel">
        <div class="sidebar-header">
            <h2>⚙️ Engine Settings</h2>
            <button class="close-btn" onclick="toggleSettings()">✕</button>
        </div>
        
        <label>Grok API Key</label>
        <input type="password" id="grokKey" placeholder="xai-...">
        
        <label>Supabase URL</label>
        <input type="text" id="supabaseUrl" placeholder="https://xyz.supabase.co">
        
        <label>Supabase Anon Key</label>
        <input type="password" id="supabaseKey" placeholder="eyJhbGci...">
        
        <button class="save-btn" onclick="saveSettings()">Save Configurations</button>
    </div>

    <div class="main-container">
        <h1>Viziahub AI Engine</h1>
        
        <div class="ai-box">
            <label>Ask Grok AI to Build Your App</label>
            <input type="text" id="aiPrompt" placeholder="e.g. Create a todo app with local storage">
            <button class="ai-btn" onclick="generateCodeWithGrok()">Generate Code via Grok</button>
        </div>

        <label>Master Code (Single File HTML/JS/CSS)</label>
        <textarea id="masterCode" placeholder="Code will appear here..."></textarea>
        
        <button class="build-btn" onclick="downloadSingleFileApp()">Download Single-File App</button>
        <div id="result"></div>
    </div>

    <script>
        window.onload = function() {
            if(localStorage.getItem('grok_key')) document.getElementById('grokKey').value = localStorage.getItem('grok_key');
            if(localStorage.getItem('sup_url')) document.getElementById('supabaseUrl').value = localStorage.getItem('sup_url');
            if(localStorage.getItem('sup_key')) document.getElementById('supabaseKey').value = localStorage.getItem('sup_key');
        };

        function toggleSettings() {
            const sidebar = document.getElementById('sidebarPanel');
            sidebar.classList.toggle('active');
        }

        function saveSettings() {
            const grokKey = document.getElementById('grokKey').value;
            const supUrl = document.getElementById('supabaseUrl').value;
            const supKey = document.getElementById('supabaseKey').value;
            
            localStorage.setItem('grok_key', grokKey);
            localStorage.setItem('sup_url', supUrl);
            localStorage.setItem('sup_key', supKey);
            
            alert("Configurations saved successfully!");
            toggleSettings();
        }

        async function generateCodeWithGrok() {
            const apiKey = localStorage.getItem('grok_key') || document.getElementById('grokKey').value;
            const supUrl = localStorage.getItem('sup_url') || document.getElementById('supabaseUrl').value;
            const supKey = localStorage.getItem('sup_key') || document.getElementById('supabaseKey').value;
            
            const promptText = document.getElementById('aiPrompt').value;
            const codeArea = document.getElementById('masterCode');
            const resultDiv = document.getElementById('result');
            
            if(!apiKey) {
                alert("Please enter and save your Grok API Key first!");
                toggleSettings();
                return;
            }
            if(!promptText) {
                alert("Please enter an app idea/prompt!");
                return;
            }
            
            resultDiv.innerHTML = "Grok is writing your single-file code...";
            
            const fullPrompt = `Create a complete, single-file mobile web app based on this request: '${promptText}'. 
            If database is needed, use these Supabase credentials config: URL: ${supUrl}, Key: ${supKey}. 
            Output ONLY valid HTML code including internal <style> and <script> tags. Do not use markdown blocks.`;

            try {
                const response = await fetch("https://api.x.ai/v1/chat/completions", {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: "grok-beta",
                        messages: [{ role: "user", content: fullPrompt }]
                    })
                });
                
                const data = await response.json();
                let code = data.choices[0].message.content;
                
                code = code.replace(/```html/g, "").replace(/```/g, "").trim();
                
                codeArea.value = code;
                resultDiv.innerHTML = "<p style='color: #4ade80;'>Code generated successfully via Grok!</p>";
            } catch (error) {
                resultDiv.innerHTML = `<p style='color: #f87171;'>Error: ${error.message}</p>`;
            }
        }

        function downloadSingleFileApp() {
            const code = document.getElementById('masterCode').value;
            if(!code) {
                alert("No code to download!");
                return;
            }
            
            const blob = new Blob([code], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "Viziahub_App.html";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
