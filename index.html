<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viziahub - AI Engine</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; margin: 0; padding: 20px; }
        
        /* Settings Modal Styling */
        #settingsOverlay {
            display: none; 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 999;
            padding: 20px; box-sizing: border-box;
        }
        #settingsOverlay.show { display: block; }
        
        .modal-content { max-width: 400px; margin: 50px auto; background: #1e293b; padding: 20px; border-radius: 10px; }
        
        input { width: 100%; padding: 10px; margin: 10px 0; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #0284c7; border: none; color: white; font-weight: bold; cursor: pointer; border-radius: 5px; margin-top: 10px; }
        .close-btn { background: #ef4444; }
        
        /* Main View */
        textarea { width: 100%; height: 200px; background: #1e293b; color: #38bdf8; border: 1px solid #334155; padding: 10px; margin-top: 20px; font-family: monospace; }
    </style>
</head>
<body>

    <button onclick="toggleSettings()">⚙️ Open Settings</button>

    <div id="settingsOverlay">
        <div class="modal-content">
            <h2>Engine Settings</h2>
            <input type="password" id="grokKey" placeholder="Grok API Key">
            <input type="text" id="supabaseUrl" placeholder="Supabase URL">
            <input type="password" id="supabaseKey" placeholder="Supabase Anon Key">
            <button onclick="saveSettings()">Save & Close</button>
            <button class="close-btn" onclick="toggleSettings()">Cancel</button>
        </div>
    </div>

    <h1>Viziahub AI Engine</h1>
    <input type="text" id="aiPrompt" placeholder="What app should I build?">
    <button onclick="generateCodeWithGrok()">Generate Code</button>
    
    <textarea id="masterCode" placeholder="Code will appear here..."></textarea>
    <button onclick="downloadCode()">Download File</button>

    <script>
        function toggleSettings() {
            const overlay = document.getElementById('settingsOverlay');
            overlay.classList.toggle('show');
        }

        function saveSettings() {
            localStorage.setItem('grok_key', document.getElementById('grokKey').value);
            localStorage.setItem('sup_url', document.getElementById('supabaseUrl').value);
            localStorage.setItem('sup_key', document.getElementById('supabaseKey').value);
            toggleSettings();
            alert("Settings Saved!");
        }

        // Load saved settings
        document.getElementById('grokKey').value = localStorage.getItem('grok_key') || "";
        document.getElementById('supabaseUrl').value = localStorage.getItem('sup_url') || "";
        document.getElementById('supabaseKey').value = localStorage.getItem('sup_key') || "";

        async function generateCodeWithGrok() {
            const apiKey = localStorage.getItem('grok_key');
            if(!apiKey) { alert("Please save API Key first!"); return; }
            
            // API logic same as before...
            alert("Generating code..."); 
        }
        
        function downloadCode() {
            const code = document.getElementById('masterCode').value;
            const blob = new Blob([code], {type: 'text/html'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = "app.html";
            a.click();
        }
    </script>
</body>
</html>
