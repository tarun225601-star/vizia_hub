<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viziahub Pro - Full Android Path & Dependency Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen p-4 flex flex-col justify-between">

    <div class="max-w-xl mx-auto w-full space-y-6">
        <!-- Header -->
        <div class="flex justify-between items-center border-b border-gray-800 pb-4">
            <h1 class="text-xl font-black text-cyan-400 tracking-wider">VIZIAHUB <span class="text-white text-xs bg-cyan-900 px-2 py-1 rounded">FULL ANDROID PATH ENGINE</span></h1>
            <button onclick="toggleSettings()" class="bg-gray-900 border border-gray-800 text-xs px-3 py-2 rounded-lg hover:bg-gray-800 text-cyan-400 font-bold flex items-center gap-1">
                ⚙️ Settings
            </button>
        </div>

        <!-- Prompt Box & Optional Custom Path -->
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 shadow-2xl space-y-4">
            <div>
                <label class="block text-xs uppercase tracking-widest text-gray-400 font-bold mb-1">App Idea / Prompt</label>
                <textarea id="promptInput" rows="3" class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-sm text-cyan-200 focus:outline-none focus:border-cyan-500 placeholder-gray-600" placeholder="e.g. Make a modern flash-light or note-taking app..."></textarea>
            </div>

            <!-- Custom File Path Input -->
            <div>
                <label class="block text-xs uppercase tracking-widest text-gray-400 font-bold mb-1">Custom Android File Path (Optional):</label>
                <input type="text" id="customPathInput" placeholder="e.g. app/src/main/java/com/viziahub/app/DatabaseHelper.java" class="w-full bg-gray-950 border border-gray-800 rounded-xl p-2.5 text-xs text-emerald-300 font-mono outline-none focus:border-emerald-500 placeholder-gray-700">
            </div>
            
            <div class="flex flex-col gap-2">
                <button onclick="generateAndDeployPackage()" id="buildBtn" class="w-full bg-cyan-500 hover:bg-cyan-400 text-gray-950 font-bold py-3 rounded-xl transition duration-200 text-sm shadow-lg shadow-cyan-500/20">
                    🚀 Build Full Android Paths + Dependencies & Trigger Pipeline
                </button>
                
                <!-- Real GitHub Actions APK Download Button -->
                <a href="#" id="downloadApkBtn" target="_blank" class="hidden w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition duration-200 text-sm border border-emerald-500 text-center shadow-lg shadow-emerald-600/20">
                    📥 Download Real APK (From GitHub Actions)
                </a>
            </div>
        </div>

        <!-- Status & Progress Area -->
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 text-center space-y-3">
            <p id="statusText" class="text-xs text-gray-400 font-mono">Idle - Android Path Pipeline Ready</p>
            
            <!-- Progress Bar -->
            <div class="w-full bg-gray-950 h-3 rounded-full overflow-hidden border border-gray-800">
                <div id="myProgressBar" class="bg-cyan-500 h-full w-0 transition-all duration-300"></div>
            </div>

            <div id="previewContainer" class="hidden pt-2">
                <button onclick="launchPreview()" class="w-full bg-gray-950 border border-cyan-500/40 hover:bg-cyan-950/30 text-cyan-400 font-semibold py-2.5 rounded-xl text-xs transition">
                    👁️ Test Live App Preview
                </button>
            </div>
        </div>
    </div>

    <!-- Enterprise Settings Modal -->
    <div id="settingsModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-gray-900 border border-gray-700 p-6 rounded-3xl w-full max-w-sm space-y-4 shadow-2xl">
            <h2 class="text-lg font-bold text-white border-b border-gray-800 pb-2">Enterprise Studio Settings</h2>
            
            <div class="space-y-3 text-left">
                <div>
                    <label class="text-[10px] uppercase text-gray-400 font-bold">Groq API Key</label>
                    <input type="password" id="m_groq" placeholder="gsk_..." class="w-full bg-gray-950 p-2.5 rounded-lg border border-gray-700 text-sm text-white">
                </div>
                <div>
                    <label class="text-[10px] uppercase text-gray-400 font-bold">GitHub Personal Access Token</label>
                    <input type="password" id="m_ghToken" placeholder="ghp_..." class="w-full bg-gray-950 p-2.5 rounded-lg border border-gray-700 text-sm text-white">
                </div>
                <div>
                    <label class="text-[10px] uppercase text-gray-400 font-bold">GitHub Username</label>
                    <input type="text" id="m_ghUser" placeholder="e.g. tarun225601-star" class="w-full bg-gray-950 p-2.5 rounded-lg border border-gray-700 text-sm text-white">
                </div>
                <div>
                    <label class="text-[10px] uppercase text-gray-400 font-bold">GitHub Repository Name</label>
                    <input type="text" id="m_ghRepo" placeholder="e.g. himanshu_app" class="w-full bg-gray-950 p-2.5 rounded-lg border border-gray-700 text-sm text-white">
                </div>
            </div>
            
            <div class="flex gap-2 pt-2">
                <button onclick="toggleSettings()" class="flex-1 bg-gray-800 hover:bg-gray-700 py-2.5 rounded-xl text-sm font-semibold text-gray-300">Cancel</button>
                <button onclick="saveSettings()" class="flex-1 bg-cyan-600 hover:bg-cyan-500 py-2.5 rounded-xl text-sm font-bold text-white shadow-lg shadow-cyan-600/20">Save</button>
            </div>
        </div>
    </div>

    <!-- Footer Note -->
    <footer class="text-center text-gray-600 text-[10px] mt-6">
        Viziahub Native Wrapper Engine • Full Android Path & Dependency Integration
    </footer>

    <script>
        let groqApiKey = localStorage.getItem('viziahub_groq_key') || '';
        let ghToken = localStorage.getItem('viz_gh_token') || '';
        let ghUser = localStorage.getItem('viz_gh_user') || '';
        let ghRepoName = localStorage.getItem('viz_gh_repo') || '';

        let appFiles = {
            indexHtml: localStorage.getItem('viz_index') || '',
            androidManifest: localStorage.getItem('viz_android_manifest') || '',
            mainActivity: localStorage.getItem('viz_main_activity') || '',
            buildGradleApp: localStorage.getItem('viz_gradle_app') || '',
            buildGradleRoot: localStorage.getItem('viz_gradle_root') || '',
            settingsGradle: localStorage.getItem('viz_settings_gradle') || '',
            buildYml: localStorage.getItem('viz_build_yml') || ''
        };

        if(appFiles.indexHtml) {
            document.getElementById('statusText').innerText = "Loaded cached android package from memory!";
            document.getElementById('previewContainer').classList.remove('hidden');
            showRealDownloadButton();
        }

        function toggleSettings() {
            const modal = document.getElementById('settingsModal');
            modal.classList.toggle('hidden');
            if(!modal.classList.contains('hidden')) {
                document.getElementById('m_groq').value = localStorage.getItem('viziahub_groq_key') || '';
                document.getElementById('m_ghToken').value = localStorage.getItem('viz_gh_token') || '';
                document.getElementById('m_ghUser').value = localStorage.getItem('viz_gh_user') || '';
                document.getElementById('m_ghRepo').value = localStorage.getItem('viz_gh_repo') || '';
            }
        }

        function saveSettings() {
            localStorage.setItem('viziahub_groq_key', document.getElementById('m_groq').value.trim());
            localStorage.setItem('viz_gh_token', document.getElementById('m_ghToken').value.trim());
            localStorage.setItem('viz_gh_user', document.getElementById('m_ghUser').value.trim());
            localStorage.setItem('viz_gh_repo', document.getElementById('m_ghRepo').value.trim());
            
            groqApiKey = localStorage.getItem('viziahub_groq_key');
            ghToken = localStorage.getItem('viz_gh_token');
            ghUser = localStorage.getItem('viz_gh_user');
            ghRepoName = localStorage.getItem('viz_gh_repo');

            alert("Settings Saved!");
            toggleSettings();
        }

        function showRealDownloadButton() {
            const dlBtn = document.getElementById('downloadApkBtn');
            if(ghUser && ghRepoName) {
                dlBtn.href = `https://github.com/${ghUser}/${ghRepoName}/actions`;
                dlBtn.classList.remove('hidden');
            }
        }

        async function generateAndDeployPackage() {
            const promptText = document.getElementById('promptInput').value.trim();
            const customPath = document.getElementById('customPathInput').value.trim();

            if(!promptText) {
                alert("Pehle prompt daal bhai!");
                return;
            }
            if(!groqApiKey || !ghToken || !ghUser || !ghRepoName) {
                alert("Pehle ⚙️ Settings mein apni API Key aur GitHub Credentials daal!");
                toggleSettings();
                return;
            }

            const status = document.getElementById('statusText');
            const buildBtn = document.getElementById('buildBtn');
            const progressBar = document.getElementById('myProgressBar');
            
            buildBtn.disabled = true;
            let width = 0;

            const progressInterval = setInterval(() => {
                if (width < 90) {
                    width++;
                    progressBar.style.width = width + "%";
                    status.innerText = `🚀 Compiling Android Paths & Dependencies (${width}%)`;
                }
            }, 800);

            try {
                // 1. Generate UI index.html via Groq
                const systemInstruction = "You are an expert mobile app UI designer. Create a fully self-contained, responsive HTML/JS app using Tailwind CSS via CDN. Output ONLY valid HTML code starting with <!DOCTYPE html> and ending with </html> without markdown blocks.";

                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${groqApiKey}` },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [
                            { role: "system", content: systemInstruction },
                            { role: "user", content: promptText }
                        ],
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                if(data.error) throw new Error(data.error.message || "Groq API Error");

                let rawHtml = data.choices[0].message.content;
                appFiles.indexHtml = rawHtml.replace(/```html/g, '').replace(/```/g, '').trim();

                // 2. Full Android Project Structure with Complete Paths and Dependencies
                appFiles.androidManifest = `<?xml version="1.0" encoding="utf-8"?>\n<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.viziahub.app">\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <application android:allowBackup="true" android:icon="@mipmap/ic_launcher" android:label="Viziahub App" android:usesCleartextTraffic="true" android:theme="@style/Theme.AppCompat.NoActionBar">\n        <activity android:name=".MainActivity" android:exported="true">\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />\n                <category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>`;
                
                appFiles.mainActivity = `package com.viziahub.app;\nimport android.os.Bundle;\nimport android.webkit.WebView;\nimport android.webkit.WebViewClient;\nimport androidx.appcompat.app.AppCompatActivity;\npublic class MainActivity extends AppCompatActivity {\n    private WebView webView;\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        webView = new WebView(this);\n        webView.getSettings().setJavaScriptEnabled(true);\n        webView.getSettings().setDomStorageEnabled(true);\n        webView.getSettings().setAllowFileAccess(true);\n        webView.setWebViewClient(new WebViewClient());\n        webView.loadUrl("file:///android_asset/index.html");\n        setContentView(webView);\n    }\n}`;

                appFiles.buildGradleApp = `plugins { id 'com.android.application' }\nandroid {\n    namespace 'com.viziahub.app'\n    compileSdk 34\n    defaultConfig {\n        applicationId "com.viziahub.app"\n        minSdk 21\n        targetSdk 34\n        versionCode 1\n        versionName "1.0"\n    }\n    buildTypes {\n        release {\n            minifyEnabled false\n        }\n    }\n}\ndependencies {\n    implementation 'androidx.appcompat:appcompat:1.6.1'\n    implementation 'com.google.android.material:material:1.9.0'\n    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'\n}`;
                
                appFiles.buildGradleRoot = `buildscript {\n    repositories {\n        google()\n        mavenCentral()\n    }\n}\nallprojects {\n    repositories {\n        google()\n        mavenCentral()\n    }\n}\nplugins {\n    id 'com.android.application' version '8.1.0' apply false\n}`;

                appFiles.settingsGradle = `rootProject.name = "${ghRepoName}";\ninclude ':app'`;

                // **Complete GitHub Actions build.yml with accurate Gradle Wrapper & Android Build Steps**
                appFiles.buildYml = `name: Build ViziaHub Android APK\non: [push]\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n    - name: Checkout Repository\n      uses: actions/checkout@v4\n    - name: Set up JDK 17\n      uses: actions/setup-java@v4\n      with:\n        distribution: 'temurin'\n        java-version: '17'\n    - name: Setup Gradle\n      uses: gradle/actions/setup-gradle@v3\n    - name: Build Debug APK with Gradle\n      run: gradle assembleDebug\n    - name: Upload APK Artifact\n      uses: actions/upload-artifact@v4\n      with:\n        name: ViziaHub-Debug-APK\n        path: app/build/outputs/apk/debug/app-debug.apk`;

                // Save to LocalStorage
                localStorage.setItem('viz_index', appFiles.indexHtml);
                localStorage.setItem('viz_android_manifest', appFiles.androidManifest);
                localStorage.setItem('viz_main_activity', appFiles.mainActivity);
                localStorage.setItem('viz_gradle_app', appFiles.buildGradleApp);
                localStorage.setItem('viz_gradle_root', appFiles.buildGradleRoot);
                localStorage.setItem('viz_settings_gradle', appFiles.settingsGradle);
                localStorage.setItem('viz_build_yml', appFiles.buildYml);

                // Optional Custom File Generation if Path provided
                let customFileContent = "";
                if(customPath) {
                    status.innerText = `✨ Generating custom file at path: ${customPath}...`;
                    const customRes = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${groqApiKey}` },
                        body: JSON.stringify({
                            model: "llama-3.3-70b-versatile",
                            messages: [
                                { role: "system", content: "You are an expert Android developer. Output clean production-ready code for the requested file path based on user prompt. Do not include markdown ticks." },
                                { role: "user", content: `Create code for file path ${customPath} based on requirement: ${promptText}` }
                            ],
                            temperature: 0.7
                        })
                    });
                    const customData = await customRes.json();
                    if(customData.choices) {
                        customFileContent = customData.choices[0].message.content.replace(/```[a-z]*/g, '').replace(/```/g, '').trim();
                    }
                }

                // 3. Push everything to correct Android paths on GitHub
                status.innerText = "☁️ Pushing to exact Android paths & workflow on GitHub...";
                await pushFilesToGitHub(customPath, customFileContent);

                clearInterval(progressInterval);
                progressBar.style.width = "100%";
                status.innerText = "✅ Pipeline Triggered! GitHub Actions is building your APK.";
                document.getElementById('previewContainer').classList.remove('hidden');
                showRealDownloadButton();

            } catch (error) {
                clearInterval(progressInterval);
                console.error(error);
                status.innerText = "Error: " + error.message;
            } finally {
                buildBtn.disabled = false;
            }
        }

        async function pushFilesToGitHub(customPath, customContent) {
            const repo = `${ghUser}/${ghRepoName}`;
            
            // Push exact Android Directory Paths & Workflow
            await uploadFile(repo, "app/src/main/assets/index.html", appFiles.indexHtml, "Update app assets index.html");
            await uploadFile(repo, "app/src/main/AndroidManifest.xml", appFiles.androidManifest, "Update AndroidManifest.xml");
            await uploadFile(repo, "app/src/main/java/com/viziahub/app/MainActivity.java", appFiles.mainActivity, "Update MainActivity.java");
            await uploadFile(repo, "app/build.gradle", appFiles.buildGradleApp, "Update app-level build.gradle");
            await uploadFile(repo, "build.gradle", appFiles.buildGradleRoot, "Update root-level build.gradle");
            await uploadFile(repo, "settings.gradle", appFiles.settingsGradle, "Update settings.gradle");
            await uploadFile(repo, ".github/workflows/build.yml", appFiles.buildYml, "Add GitHub Actions workflow build.yml");

            // Push Custom File to exact requested path if specified
            if(customPath && customContent) {
                await uploadFile(repo, customPath, customContent, `Add custom Android file: ${customPath}`);
            }
        }

        async function uploadFile(repo, path, content, message) {
            const url = `https://api.github.com/repos/${repo}/contents/${path}`;
            let sha = "";
            try {
                const getRes = await fetch(url, { headers: { 'Authorization': `Bearer ${ghToken}` } });
                if(getRes.ok) {
                    const fileData = await getRes.json();
                    sha = fileData.sha;
                }
            } catch(e) {}

            const bodyData = {
                message: message,
                content: btoa(unescape(encodeURIComponent(content))),
                branch: "main"
            };
            if(sha) bodyData.sha = sha;

            await fetch(url, {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${ghToken}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(bodyData)
            });
        }

        function launchPreview() {
            if(!appFiles.indexHtml) return alert("No app found!");
            const win = window.open();
            win.document.write(appFiles.indexHtml);
            win.document.close();
        }
    </script>
</body>
</html>
