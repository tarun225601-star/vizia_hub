<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viziahub Pro - Hybrid 70B Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen p-4 flex flex-col justify-between">

    <div class="max-w-xl mx-auto w-full space-y-6">
        <!-- Header -->
        <div class="flex justify-between items-center border-b border-gray-800 pb-4">
            <h1 class="text-xl font-black text-cyan-400 tracking-wider">VIZIAHUB <span class="text-white text-xs bg-emerald-900 px-2 py-1 rounded">HYBRID LINK AGENT</span></h1>
            <button onclick="toggleSettings()" class="bg-gray-900 border border-gray-800 text-xs px-3 py-2 rounded-lg hover:bg-gray-800 text-cyan-400 font-bold flex items-center gap-1">
                ⚙️ Settings
            </button>
        </div>

        <!-- Prompt Box & Hybrid Options -->
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 shadow-2xl space-y-4">
            <div>
                <label class="block text-xs uppercase tracking-widest text-cyan-400 font-bold mb-1">🧠 Hybrid App Prompt / Instructions</label>
                <textarea id="promptInput" rows="3" class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-sm text-cyan-200 focus:outline-none focus:border-cyan-500 placeholder-gray-600" placeholder="e.g. Build a fully functional smart calculator app with modern UI..."></textarea>
            </div>

            <!-- Image Upload (Optional) -->
            <div>
                <label class="block text-xs uppercase tracking-widest text-emerald-400 font-bold mb-1">📸 Upload Reference Screenshot (Optional):</label>
                <input type="file" id="imageInput" accept="image/*" class="w-full bg-gray-950 border border-gray-800 rounded-xl p-2 text-xs text-gray-300 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-cyan-600 file:text-white hover:file:bg-cyan-500 cursor-pointer">
            </div>

            <!-- Custom File Path Input -->
            <div>
                <label class="block text-xs uppercase tracking-widest text-gray-400 font-bold mb-1">Custom Android File Path (Optional):</label>
                <input type="text" id="customPathInput" placeholder="e.g. app/src/main/java/com/viziahub/app/CalculatorLogic.java" class="w-full bg-gray-950 border border-gray-800 rounded-xl p-2.5 text-xs text-emerald-300 font-mono outline-none focus:border-emerald-500 placeholder-gray-700">
            </div>
            
            <div class="flex flex-col gap-2">
                <button onclick="generateHybridAppPackage()" id="buildBtn" class="w-full bg-gradient-to-r from-cyan-500 to-emerald-500 hover:from-cyan-400 hover:to-emerald-400 text-gray-950 font-bold py-3.5 rounded-xl transition duration-200 text-sm shadow-lg shadow-cyan-500/20">
                    ⚡ Run Hybrid 70B Agent & Build Pipeline
                </button>
                
                <!-- Multi-Action Buttons (Preview, Link, GitHub APK) -->
                <div class="grid grid-cols-1 gap-2 pt-1">
                    <button onclick="launchPreview()" id="previewActionBtn" class="hidden w-full bg-gray-950 border border-cyan-500/40 hover:bg-cyan-950/30 text-cyan-400 font-semibold py-2.5 rounded-xl text-xs transition">
                        👁️ Test Live HTML Preview
                    </button>
                    
                    <button onclick="copyWebLink()" id="copyLinkBtn" class="hidden w-full bg-cyan-950/50 border border-cyan-500 text-cyan-300 hover:bg-cyan-900 font-bold py-2.5 rounded-xl transition duration-200 text-xs text-center">
                        🔗 Copy Instant Web Link (For App Converters)
                    </button>

                    <a href="#" id="downloadApkBtn" target="_blank" class="hidden w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl transition duration-200 text-xs border border-emerald-500 text-center shadow-lg shadow-emerald-600/20 flex items-center justify-center">
                        📥 GitHub APK Actions
                    </a>
                </div>
            </div>
        </div>

        <!-- Status & Step-by-Step Chunk Progress Area -->
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 text-center space-y-3">
            <p id="statusText" class="text-xs text-cyan-300 font-mono">Idle - Hybrid Agent Standing By</p>
            
            <!-- Progress Bar -->
            <div class="w-full bg-gray-950 h-3 rounded-full overflow-hidden border border-gray-800">
                <div id="myProgressBar" class="bg-gradient-to-r from-cyan-500 to-emerald-500 h-full w-0 transition-all duration-300"></div>
            </div>
        </div>
    </div>

    <!-- Enterprise Settings Modal -->
    <div id="settingsModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-gray-900 border border-gray-700 p-6 rounded-3xl w-full max-w-sm space-y-4 shadow-2xl">
            <h2 class="text-lg font-bold text-white border-b border-gray-800 pb-2">Agent Studio Settings</h2>
            
            <div class="space-y-3 text-left">
                <div>
                    <label class="text-[10px] uppercase text-gray-400 font-bold">Groq API Key</label>
                    <input type="password" id="m_groq" placeholder="gsk_..." class="w-full bg-gray-950 p-2.5 rounded-lg border border-gray-700 text-sm text-white">
                </div>
                <div>
                    <label class="text-[10px] uppercase text-gray-400 font-bold">GitHub Personal Access Token</label>
                    <input type="password" id="m_ghToken" placeholder="ghp_..." class="w-full bg-gray-950 p-2.5 rounded-lg border border-gray-700 text-sm text-white">
                </div>
                <div>
                    <label class="text-[10px] uppercase text-gray-400 font-bold">GitHub Username</label>
                    <input type="text" id="m_ghUser" placeholder="e.g. tarun225601-star" class="w-full bg-gray-950 p-2.5 rounded-lg border border-gray-700 text-sm text-white">
                </div>
                <div>
                    <label class="text-[10px] uppercase text-gray-400 font-bold">GitHub Repository Name</label>
                    <input type="text" id="m_ghRepo" placeholder="e.g. himanshu_app" class="w-full bg-gray-950 p-2.5 rounded-lg border border-gray-700 text-sm text-white">
                </div>
            </div>
            
            <div class="flex gap-2 pt-2">
                <button onclick="toggleSettings()" class="flex-1 bg-gray-800 hover:bg-gray-700 py-2.5 rounded-xl text-sm font-semibold text-gray-300">Cancel</button>
                <button onclick="saveSettings()" class="flex-1 bg-cyan-600 hover:bg-cyan-500 py-2.5 rounded-xl text-sm font-bold text-white shadow-lg shadow-cyan-600/20">Save</button>
            </div>
        </div>
    </div>

    <!-- Footer Note -->
    <footer class="text-center text-gray-600 text-[10px] mt-6">
        Viziahub Hybrid Engine • 10,000 Crore Vision Edition
    </footer>

    <script>
        const SELECTED_MODEL = "llama-3.3-70b-versatile";

        let groqApiKey = localStorage.getItem('viziahub_groq_key') || '';
        let ghToken = localStorage.getItem('viz_gh_token') || '';
        let ghUser = localStorage.getItem('viz_gh_user') || '';
        let ghRepoName = localStorage.getItem('viz_gh_repo') || '';

        let appFiles = {
            indexHtml: localStorage.getItem('viz_index') || '',
            androidManifest: localStorage.getItem('viz_android_manifest') || '',
            mainActivity: localStorage.getItem('viz_main_activity') || '',
            buildGradleApp: localStorage.getItem('viz_gradle_app') || '',
            buildGradleRoot: localStorage.getItem('viz_gradle_root') || '',
            settingsGradle: localStorage.getItem('viz_settings_gradle') || '',
            buildYml: localStorage.getItem('viz_build_yml') || ''
        };

        let generatedBlobUrl = "";

        if(appFiles.indexHtml) {
            document.getElementById('statusText').innerText = "Loaded cached hybrid application from memory!";
            document.getElementById('previewActionBtn').classList.remove('hidden');
            document.getElementById('copyLinkBtn').classList.remove('hidden');
            createBlobUrl(appFiles.indexHtml);
            showRealDownloadButton();
        }

        function toggleSettings() {
            const modal = document.getElementById('settingsModal');
            modal.classList.toggle('hidden');
            if(!modal.classList.contains('hidden')) {
                document.getElementById('m_groq').value = localStorage.getItem('viziahub_groq_key') || '';
                document.getElementById('m_ghToken').value = localStorage.getItem('viz_gh_token') || '';
                document.getElementById('m_ghUser').value = localStorage.getItem('viz_gh_user') || '';
                document.getElementById('m_ghRepo').value = localStorage.getItem('viz_gh_repo') || '';
            }
        }

        function saveSettings() {
            localStorage.setItem('viziahub_groq_key', document.getElementById('m_groq').value.trim());
            localStorage.setItem('viz_gh_token', document.getElementById('m_ghToken').value.trim());
            localStorage.setItem('viz_gh_user', document.getElementById('m_ghUser').value.trim());
            localStorage.setItem('viz_gh_repo', document.getElementById('m_ghRepo').value.trim());
            
            groqApiKey = localStorage.getItem('viziahub_groq_key');
            ghToken = localStorage.getItem('viz_gh_token');
            ghUser = localStorage.getItem('viz_gh_user');
            ghRepoName = localStorage.getItem('viz_gh_repo');

            alert("Hybrid Settings Saved Successfully!");
            toggleSettings();
        }

        function showRealDownloadButton() {
            const dlBtn = document.getElementById('downloadApkBtn');
            if(ghUser && ghRepoName) {
                dlBtn.href = `https://github.com/${ghUser}/${ghRepoName}/actions`;
                dlBtn.classList.remove('hidden');
            }
        }

        function createBlobUrl(htmlContent) {
            const blob = new Blob([htmlContent], { type: 'text/html' });
            generatedBlobUrl = URL.createObjectURL(blob);
        }

        function copyWebLink() {
            if(!generatedBlobUrl) return alert("No link generated yet!");
            navigator.clipboard.writeText(generatedBlobUrl);
            alert("🔗 Instant Web Link Copied! Ab aap isse kisi bhi Web-to-App converter mein paste kar sakte hain.");
        }

        async function callAgentChunk(systemRole, promptText) {
            const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${groqApiKey}` },
                body: JSON.stringify({
                    model: SELECTED_MODEL,
                    messages: [
                        { role: "system", content: systemRole },
                        { role: "user", content: promptText }
                    ],
                    temperature: 0.7,
                    max_tokens: 8192
                })
            });
            const data = await response.json();
            if (data.error || !data.choices) {
                throw new Error(data.error ? data.error.message : "Agent chunk generation failed!");
            }
            return data.choices[0].message.content.replace(/```html/g, '').replace(/```[a-z]*/g, '').replace(/```/g, '').trim();
        }

        async function generateHybridAppPackage() {
            const promptText = document.getElementById('promptInput').value.trim();
            const customPath = document.getElementById('customPathInput').value.trim();

            if(!promptText) {
                alert("Pehle app ka prompt ya instruction daal bhai!");
                return;
            }
            if(!groqApiKey || !ghToken || !ghUser || !ghRepoName) {
                alert("Pehle ⚙️ Settings mein apni API Key aur GitHub Credentials daal!");
                toggleSettings();
                return;
            }

            const status = document.getElementById('statusText');
            const buildBtn = document.getElementById('buildBtn');
            const progressBar = document.getElementById('myProgressBar');
            
            buildBtn.disabled = true;
            let width = 10;
            progressBar.style.width = width + "%";

            try {
                status.innerText = "🤖 Agent Phase 1: Generating Hybrid UI & Single index.html...";
                width = 30; progressBar.style.width = width + "%";

                const htmlSystemPrompt = "You are an expert hybrid app developer. Create a fully self-contained, responsive, clean single-file app using Tailwind CSS via CDN, containing internal CSS and JavaScript logic inside the same HTML file. Output ONLY valid HTML starting with <!DOCTYPE html> and ending with </html>.";
                appFiles.indexHtml = await callAgentChunk(htmlSystemPrompt, promptText);
                
                // Create instant web link
                createBlobUrl(appFiles.indexHtml);

                width = 50; progressBar.style.width = width + "%";

                status.innerText = "⚙️ Agent Phase 2: Generating Clean GitHub Files & Gradle Structure...";
                
                appFiles.androidManifest = `<?xml version="1.0" encoding="utf-8"?>\n<manifest xmlns:android="[http://schemas.android.com/apk/res/android](http://schemas.android.com/apk/res/android)" package="com.viziahub.app">\n    <uses-permission android:name="android.permission.INTERNET" />\n    <application android:allowBackup="true" android:icon="@mipmap/ic_launcher" android:label="Viziahub Hybrid App" android:usesCleartextTraffic="true" android:theme="@style/Theme.AppCompat.NoActionBar">\n        <activity android:name=".MainActivity" android:exported="true">\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />\n                <category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>`;
                
                appFiles.mainActivity = `package com.viziahub.app;\nimport android.os.Bundle;\nimport android.webkit.WebView;\nimport android.webkit.WebViewClient;\nimport androidx.appcompat.app.AppCompatActivity;\npublic class MainActivity extends AppCompatActivity {\n    private WebView webView;\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        webView = new WebView(this);\n        webView.getSettings().setJavaScriptEnabled(true);\n        webView.getSettings().setDomStorageEnabled(true);\n        webView.getSettings().setAllowFileAccess(true);\n        webView.setWebViewClient(new WebViewClient());\n        webView.loadUrl("file:///android_asset/index.html");\n        setContentView(webView);\n    }\n}`;

                appFiles.buildGradleApp = `plugins { id 'com.android.application' }\nandroid {\n    namespace 'com.viziahub.app'\n    compileSdk 34\n    defaultConfig {\n        applicationId "com.viziahub.app"\n        minSdk 21\n        targetSdk 34\n        versionCode 1\n        versionName "1.0"\n    }\n    buildTypes {\n        release {\n            minifyEnabled false\n        }\n    }\n}\ndependencies {\n    implementation 'androidx.appcompat:appcompat:1.6.1'\n    implementation 'com.google.android.material:material:1.9.0'\n    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'\n}`;
                
                appFiles.buildGradleRoot = `buildscript {\n    repositories {\n        google()\n        mavenCentral()\n    }\n}\nallprojects {\n    repositories {\n        google()\n        mavenCentral()\n    }\n}\nplugins {\n    id 'com.android.application' version '8.1.0' apply false\n}`;

                appFiles.settingsGradle = `pluginManagement {\n    repositories {\n        google()\n        mavenCentral()\n        gradlePluginPortal()\n    }\n}\ndependencyResolutionManagement {\n    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n    repositories {\n        google()\n        mavenCentral()\n    }\n}\nrootProject.name = "${ghRepoName}";\ninclude ':app'`;

                appFiles.buildYml = `name: Build ViziaHub Android APK\non: [push]\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n    - name: Checkout Repository\n      uses: actions/checkout@v4\n    - name: Set up JDK 17\n      uses: actions/setup-java@v4\n      with:\n        distribution: 'temurin'\n        java-version: '17'\n    - name: Setup Gradle\n      uses: gradle/actions/setup-gradle@v3\n    - name: Build Debug APK with Gradle\n      run: gradle assembleDebug\n    - name: Upload APK Artifact\n      uses: actions/upload-artifact@v4\n      with:\n        name: ViziaHub-Debug-APK\n        path: app/build/outputs/apk/debug/app-debug.apk`;

                width = 70; progressBar.style.width = width + "%";

                localStorage.setItem('viz_index', appFiles.indexHtml);
                localStorage.setItem('viz_android_manifest', appFiles.androidManifest);
                localStorage.setItem('viz_main_activity', appFiles.mainActivity);
                localStorage.setItem('viz_gradle_app', appFiles.buildGradleApp);
                localStorage.setItem('viz_gradle_root', appFiles.buildGradleRoot);
                localStorage.setItem('viz_settings_gradle', appFiles.settingsGradle);
                localStorage.setItem('viz_build_yml', appFiles.buildYml);

                let customFileContent = "";
                if(customPath) {
                    status.innerText = `✨ Agent Phase 3: Writing custom file at ${customPath}...`;
                    const customSys = "You are an expert software engineer. Output clean, production-ready code for the requested file path without markdown blocks.";
                    customFileContent = await callAgentChunk(customSys, `Create code for file path ${customPath} based on: ${promptText}`);
                }

                status.innerText = "☁️ Pushing hybrid files & GitHub structure to repository...";
                width = 85; progressBar.style.width = width + "%";
                
                await pushFilesToGitHub(customPath, customFileContent);

                width = 100; progressBar.style.width = width + "%";
                status.innerText = "✅ Hybrid Agent Complete! index.html ready & GitHub Pipeline triggered.";
                
                document.getElementById('previewActionBtn').classList.remove('hidden');
                document.getElementById('copyLinkBtn').classList.remove('hidden');
                showRealDownloadButton();

            } catch (error) {
                console.error(error);
                status.innerText = "❌ Agent Error: " + error.message;
            } finally {
                buildBtn.disabled = false;
            }
        }

        async function pushFilesToGitHub(customPath, customContent) {
            const repo = `${ghUser}/${ghRepoName}`;
            
            await uploadFile(repo, "app/src/main/assets/index.html", appFiles.indexHtml, "Update hybrid index.html via 70B Agent");
            await uploadFile(repo, "app/src/main/AndroidManifest.xml", appFiles.androidManifest, "Update AndroidManifest.xml");
            await uploadFile(repo, "app/src/main/java/com/viziahub/app/MainActivity.java", appFiles.mainActivity, "Update MainActivity.java");
            await uploadFile(repo, "app/build.gradle", appFiles.buildGradleApp, "Update app build.gradle");
            await uploadFile(repo, "build.gradle", appFiles.buildGradleRoot, "Update root build.gradle");
            await uploadFile(repo, "settings.gradle", appFiles.settingsGradle, "Update robust settings.gradle");
            await uploadFile(repo, ".github/workflows/build.yml", appFiles.buildYml, "Update workflow build.yml");

            if(customPath && customContent) {
                await uploadFile(repo, customPath, customContent, `Add custom file: ${customPath}`);
            }
        }

        async function uploadFile(repo, path, content, message) {
            const url = `[https://api.github.com/repos/$](https://api.github.com/repos/$){repo}/contents/${path}`;
            let sha = "";
            try {
                const getRes = await fetch(url, { headers: { 'Authorization': `Bearer ${ghToken}` } });
                if(getRes.ok) {
                    const fileData = await getRes.json();
                    sha = fileData.sha;
                }
            } catch(e) {}

            const bodyData = {
                message: message,
                content: btoa(unescape(encodeURIComponent(content))),
                branch: "main"
            };
            if(sha) bodyData.sha = sha;

            await fetch(url, {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${ghToken}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(bodyData)
            });
        }

        function launchPreview() {
            if(!appFiles.indexHtml) return alert("No hybrid app found in memory!");
            const win = window.open();
            win.document.write(appFiles.indexHtml);
            win.document.close();
        }
    </script>
</body>
</html>
