<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viziahub App Factory</title>
    <!-- Tailwind CSS for high-level modern UI -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen p-6 flex flex-col items-center">

    <div class="w-full max-w-lg bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-2xl">
        <h1 class="text-2xl font-black text-cyan-400 mb-6 text-center">Viziahub Engine (Groq)</h1>
        
        <!-- API Settings Button -->
        <button onclick="toggleSettings()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold p-3 rounded-xl mb-4 border border-slate-700 transition">⚙️ Set Groq API Key</button>

        <!-- Prompt Input -->
        <label class="block text-sm font-medium text-slate-300 mb-2">App Description</label>
        <textarea id="aiPrompt" class="w-full h-32 bg-slate-950 border border-slate-800 p-4 rounded-xl text-white focus:ring-2 focus:ring-cyan-500 outline-none resize-none mb-4" placeholder="e.g. Ek aisi app banao jisme todo list ho..."></textarea>
        
        <!-- Build Button -->
        <button id="genBtn" onclick="buildApp()" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold p-4 rounded-xl transition shadow-lg shadow-cyan-900/30 mb-4">🚀 Build & Pack App</button>
        
        <!-- Download Released App Button -->
        <button id="dlBtn" onclick="downloadAppFile()" disabled class="w-full bg-emerald-600/50 text-white/50 font-bold p-4 rounded-xl cursor-not-allowed transition">📥 Download Released App (.html)</button>
        
        <p id="status" class="text-center mt-4 text-xs text-slate-400">Status: Ready to build</p>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-sm p-6 rounded-2xl">
            <h2 class="text-lg font-bold text-cyan-400 mb-4">Groq API Configuration</h2>
            <input type="password" id="groqKey" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-white mb-4 outline-none focus:border-cyan-500" placeholder="Paste Groq API Key">
            <button onclick="saveKey()" class="w-full bg-cyan-600 font-bold p-3 rounded-xl mb-2">Save Key</button>
            <button onclick="toggleSettings()" class="w-full bg-slate-800 text-slate-300 p-3 rounded-xl">Close</button>
        </div>
    </div>

    <!-- Hidden Master Storage -->
    <textarea id="masterCode" class="hidden"></textarea>

    <script>
        window.onload = function() {
            if(localStorage.getItem('groq_key')) {
                document.getElementById('groqKey').value = localStorage.getItem('groq_key');
            }
        }

        function toggleSettings() {
            const modal = document.getElementById('settingsModal');
            modal.classList.toggle('hidden');
        }

        function saveKey() {
            const key = document.getElementById('groqKey').value;
            localStorage.setItem('groq_key', key);
            alert("Groq API Key Saved Successfully!");
            toggleSettings();
        }

        async function buildApp() {
            const apiKey = localStorage.getItem('groq_key');
            const promptText = document.getElementById('aiPrompt').value;
            const genBtn = document.getElementById('genBtn');
            const dlBtn = document.getElementById('dlBtn');
            const status = document.getElementById('status');

            if(!apiKey) {
                alert("Pehle Settings me jaakar Groq API Key save karo!");
                toggleSettings();
                return;
            }
            if(!promptText) {
                alert("Bhai, app ka idea toh likh!");
                return;
            }

            genBtn.innerText = "Building App...";
            genBtn.disabled = true;
            status.innerText = "Status: Groq is packaging your app...";

            const systemPrompt = `You are an elite master app developer. Create a complete, fully functional, high-level single-file mobile web app based on the user's request. - Use Tailwind CSS via CDN for styling. - Include all CSS, JavaScript, and HTML inside a single file. - Make it interactive, beautiful, and fully responsive for mobile screens. - Output ONLY raw, clean HTML code. Do not include markdown ticks like \`\`\`html or any conversational text.`;

            try {
                // Groq API Endpoint aur Llama 3.3 70B Model सेट किया गया है
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [
                            { role: "system", content: systemPrompt },
                            { role: "user", content: promptText }
                        ]
                    })
                });

                const data = await response.json();
                
                if (!data.choices || !data.choices[0] || !data.choices[0].message) {
                    throw new Error(data.error?.message || "API response invalid. Check your API key.");
                }

                let packedCode = data.choices[0].message.content;
                packedCode = packedCode.replace(/```html/g, "").replace(/```/g, "").trim();

                document.getElementById('masterCode').value = packedCode;

                dlBtn.disabled = false;
                dlBtn.classList.remove("bg-emerald-600/50", "text-white/50", "cursor-not-allowed");
                dlBtn.classList.add("bg-emerald-600", "hover:bg-emerald-500", "shadow-lg", "shadow-emerald-900/30");
                
                status.innerText = "Status: App successfully released and ready!";
            } catch (error) {
                status.innerText = "Status Error: " + error.message;
            } finally {
                genBtn.innerText = "🚀 Build & Pack App";
                genBtn.disabled = false;
            }
        }

        function downloadAppFile() {
            const code = document.getElementById('masterCode').value;
            if(!code) {
                alert("Pehle app build toh karo!");
                return;
            }

            const blob = new Blob([code], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "Viziahub_App.html";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
