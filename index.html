<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viziahub Pro - Groq & GitHub Android Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- JSZip CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen p-4 flex flex-col justify-between">

    <div class="max-w-xl mx-auto w-full space-y-6">
        <!-- Header -->
        <div class="flex justify-between items-center border-b border-gray-800 pb-4">
            <h1 class="text-2xl font-black text-cyan-400 tracking-wider">VIZIAHUB <span class="text-white text-xs bg-cyan-900 px-2 py-1 rounded">PRO ENGINE</span></h1>
            <div class="flex gap-2">
                <button onclick="openSettings()" class="bg-gray-900 border border-gray-800 text-xs px-3 py-2 rounded-lg hover:bg-gray-800 text-gray-300">⚙️ Groq API</button>
                <button onclick="openGitHubSettings()" class="bg-gray-900 border border-gray-800 text-xs px-3 py-2 rounded-lg hover:bg-gray-800 text-purple-400">🐙 GitHub Config</button>
            </div>
        </div>

        <!-- Prompt Box -->
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 shadow-2xl space-y-4">
            <label class="block text-xs uppercase tracking-widest text-gray-400 font-bold">App Idea Prompt</label>
            <textarea id="promptInput" rows="4" class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-sm text-cyan-200 focus:outline-none focus:border-cyan-500 placeholder-gray-600" placeholder="e.g. Make simple calculator app..."></textarea>
            
            <div class="flex flex-col gap-2">
                <button onclick="generateAndDeployPackage()" id="buildBtn" class="w-full bg-cyan-500 hover:bg-cyan-400 text-gray-950 font-bold py-3 rounded-xl transition duration-200 text-sm shadow-lg shadow-cyan-500/20">
                    🚀 Build Full Android Package & APK
                </button>
                <button onclick="downloadAndroidZip()" id="downloadBtn" disabled class="w-full bg-gray-800 text-gray-500 font-bold py-3 rounded-xl transition duration-200 text-sm border border-gray-700 cursor-not-allowed">
                    📦 Download Android ZIP (Studio Project)
                </button>
            </div>
        </div>

        <!-- Status & Progress Area -->
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 text-center space-y-3">
            <p id="statusText" class="text-xs text-gray-400 font-mono">Ready via Groq & GitHub Cloud</p>
            
            <!-- Progress Bar -->
            <div class="w-full bg-gray-950 h-3 rounded-full overflow-hidden border border-gray-800">
                <div id="myProgressBar" class="bg-cyan-500 h-full w-0 transition-all duration-300"></div>
            </div>

            <div id="previewContainer" class="hidden pt-2">
                <button onclick="launchPreview()" class="w-full bg-gray-950 border border-cyan-500/40 hover:bg-cyan-950/30 text-cyan-400 font-semibold py-2.5 rounded-xl text-xs transition">
                    👁️ Test Live App Preview
                </button>
            </div>
        </div>
    </div>

    <!-- Footer Note -->
    <footer class="text-center text-gray-600 text-[10px] mt-6">
        Viziahub Native Wrapper Engine • Zero-Cost Cloud Pipeline
    </footer>

    <script>
        let groqApiKey = localStorage.getItem('viziahub_groq_key') || '';
        let ghToken = localStorage.getItem('viz_gh_token') || '';
        let ghRepo = localStorage.getItem('viz_gh_repo') || ''; // format: username/repository

        let appFiles = {
            indexHtml: localStorage.getItem('viz_index') || '',
            manifestJson: localStorage.getItem('viz_manifest') || '',
            swJs: localStorage.getItem('viz_sw') || '',
            androidManifest: localStorage.getItem('viz_android_manifest') || '',
            mainActivity: localStorage.getItem('viz_main_activity') || '',
            buildGradle: localStorage.getItem('viz_gradle') || ''
        };

        if(appFiles.indexHtml) {
            document.getElementById('statusText').innerText = "Last built Android package loaded from memory!";
            document.getElementById('previewContainer').classList.remove('hidden');
            enableDownloadButton();
        }

        function openSettings() {
            const key = prompt("Enter your Groq API Key:", groqApiKey);
            if(key !== null) {
                groqApiKey = key.trim();
                localStorage.setItem('viziahub_groq_key', groqApiKey);
                alert("Groq API Key Saved Successfully!");
            }
        }

        function openGitHubSettings() {
            const token = prompt("Enter GitHub Personal Access Token:", ghToken);
            if(token !== null) {
                ghToken = token.trim();
                localStorage.setItem('viz_gh_token', ghToken);
            }
            const repo = prompt("Enter GitHub Repository (e.g. username/repo-name):", ghRepo);
            if(repo !== null) {
                ghRepo = repo.trim();
                localStorage.setItem('viz_gh_repo', ghRepo);
            }
            alert("GitHub Configuration Saved Successfully!");
        }

        function enableDownloadButton() {
            const dlBtn = document.getElementById('downloadBtn');
            dlBtn.disabled = false;
            dlBtn.className = "w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3 rounded-xl transition duration-200 text-sm border border-cyan-500 cursor-pointer shadow-lg shadow-cyan-600/20";
        }

        async function generateAndDeployPackage() {
            const promptText = document.getElementById('promptInput').value.trim();
            if(!promptText) {
                alert("Pehle prompt toh daal bhai!");
                return;
            }
            if(!groqApiKey) {
                alert("Pehle ⚙️ Groq API Settings mein jaakar apni Key daal!");
                openSettings();
                return;
            }

            const status = document.getElementById('statusText');
            const buildBtn = document.getElementById('buildBtn');
            const progressBar = document.getElementById('myProgressBar');
            
            buildBtn.disabled = true;
            let width = 0;

            // प्रोग्रेस बार और डायनामिक मैसेज लूप शुरू (5 मिनट / 100% के हिसाब से)
            const messages = [
                "Initializing Groq AI Engine...",
                "Generating App UI & Code via Llama3...",
                "Structuring Android Manifest & Assets...",
                "Pushing Code to Cloud Pipeline...",
                "Triggering GitHub Actions Build...",
                "Compiling Gradle & Generating APK..."
            ];

            const progressInterval = setInterval(() => {
                if (width < 95) {
                    width++;
                    progressBar.style.width = width + "%";
                    let msgIndex = Math.floor(width / 17);
                    status.innerText = `🚀 ${messages[msgIndex] || "Processing..."} (${width}%)`;
                }
            }, 2500); // लगभग 4 मिनट में 95% तक पहुँचेगा

            try {
                // 1. Groq से कोड जनरेट करवाना
                const systemInstruction = "You are an expert mobile web application developer. Create a fully self-contained, responsive, high-performance HTML/JS application (using Tailwind CSS via CDN) based on the user request. Make it look like a real native mobile app. Output ONLY valid HTML code starting with <!DOCTYPE html> and ending with </html> without markdown code blocks.";

                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${groqApiKey}`
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [
                            { role: "system", content: systemInstruction },
                            { role: "user", content: promptText }
                        ],
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                if(data.error) throw new Error(data.error.message || "Groq API Error");

                let rawHtml = data.choices[0].message.content;
                rawHtml = rawHtml.replace(/```html/g, '').replace(/```/g, '').trim();

                // 2. फाइल्स तैयार करना
                appFiles.indexHtml = rawHtml;
                appFiles.manifestJson = JSON.stringify({
                    "name": "Viziahub Native App",
                    "short_name": "VizApp",
                    "start_url": "index.html",
                    "display": "standalone",
                    "background_color": "#030712",
                    "theme_color": "#06b6d4",
                    "icons": [{"src": "icon.png", "sizes": "192x192", "type": "image/png"}]
                }, null, 2);

                appFiles.swJs = `self.addEventListener('install', e => e.waitUntil(caches.open('viz-v1').then(c => c.addAll(['index.html', 'manifest.json']))));\nself.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));`.trim();

                appFiles.androidManifest = `<?xml version="1.0" encoding="utf-8"?>\n<manifest xmlns:android="http://schemas.android.com/apk/res/android"\n    package="com.viziahub.app">\n    <uses-permission android:name="android.permission.INTERNET" />\n    <application android:allowBackup="true" android:icon="@mipmap/ic_launcher" android:label="Viziahub App" android:theme="@style/Theme.AppCompat.NoActionBar">\n        <activity android:name=".MainActivity" android:exported="true">\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />\n                <category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>`;

                appFiles.mainActivity = `package com.viziahub.app;\nimport android.os.Bundle;\nimport android.webkit.WebSettings;\nimport android.webkit.WebView;\nimport android.webkit.WebViewClient;\nimport androidx.appcompat.app.AppCompatActivity;\npublic class MainActivity extends AppCompatActivity {\n    private WebView webView;\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        webView = new WebView(this);\n        webView.getSettings().setJavaScriptEnabled(true);\n        webView.getSettings().setDomStorageEnabled(true);\n        webView.setWebViewClient(new WebViewClient());\n        webView.loadUrl("file:///android_asset/index.html");\n        setContentView(webView);\n    }\n}`;

                appFiles.buildGradle = `plugins { id 'com.android.application' }\nandroid { compileSdk 34\ndefaultConfig { applicationId "com.viziahub.app"; minSdk 21; targetSdk 34; versionCode 1; versionName "1.0" }\nbuildTypes { release { minifyEnabled false } }\n}\ndependencies { implementation 'androidx.appcompat:appcompat:1.6.1'; implementation 'com.google.android.material:material:1.9.0' }`;

                // LocalStorage में सेव
                localStorage.setItem('viz_index', appFiles.indexHtml);
                localStorage.setItem('viz_manifest', appFiles.manifestJson);
                localStorage.setItem('viz_sw', appFiles.swJs);
                localStorage.setItem('viz_android_manifest', appFiles.androidManifest);
                localStorage.setItem('viz_main_activity', appFiles.mainActivity);
                localStorage.setItem('viz_gradle', appFiles.buildGradle);

                // 3. यदि GitHub Token और Repo सेट है, तो ऑटोमैटिक पुश करो
                if(ghToken && ghRepo) {
                    await pushToGitHub(appFiles.indexHtml);
                }

                clearInterval(progressInterval);
                progressBar.style.width = "100%";
                status.innerText = "✅ Complete Android Package Built & GitHub Pipeline Triggered!";
                document.getElementById('previewContainer').classList.remove('hidden');
                enableDownloadButton();

            } catch (error) {
                clearInterval(progressInterval);
                console.error(error);
                status.innerText = "Error: " + error.message;
            } finally {
                buildBtn.disabled = false;
            }
        }

        // GitHub API के ज़रिए कोड पुश करने का फंक्शन
        async function pushToGitHub(htmlContent) {
            const path = "app/src/main/assets/index.html";
            const url = `https://api.github.com/repos/${ghRepo}/contents/${path}`;
            
            // पहले फाइल की sha निकालनी पड़ती है अपडेट करने के लिए
            let sha = "";
            try {
                const getRes = await fetch(url, {
                    headers: { 'Authorization': `Bearer ${ghToken}` }
                });
                if(getRes.ok) {
                    const fileData = await getRes.json();
                    sha = fileData.sha;
                }
            } catch(e) { console.log("New file creation"); }

            // GitHub पर फाइल कमिट करना
            const bodyData = {
                message: "Auto-update App via ViziaHub Engine",
                content: btoa(unescape(encodeURIComponent(htmlContent))),
                branch: "main"
            };
            if(sha) bodyData.sha = sha;

            await fetch(url, {
                method: 'PUT',
                headers: {
                    'Authorization': `Bearer ${ghToken}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(bodyData)
            });
        }

        function launchPreview() {
            if(!appFiles.indexHtml) return alert("Pehle app build kar le!");
            const win = window.open();
            win.document.write(appFiles.indexHtml);
            win.document.close();
        }

        async function downloadAndroidZip() {
            if(!appFiles.indexHtml) return alert("Pehle app build toh kar!");
            
            const zip = new JSZip();
            zip.folder("app/src/main/assets").file("index.html", appFiles.indexHtml);
            zip.folder("app/src/main/assets").file("manifest.json", appFiles.manifestJson);
            zip.folder("app/src/main/assets").file("sw.js", appFiles.swJs);
            zip.folder("app/src/main/java/com/viziahub/app").file("MainActivity.java", appFiles.mainActivity);
            zip.folder("app/src/main").file("AndroidManifest.xml", appFiles.androidManifest);
            zip.folder("app").file("build.gradle", appFiles.buildGradle);
            zip.file("README.txt", "Viziahub Android Wrapper Package.\n1. Open in Android Studio.\n2. Build APK.");

            const content = await zip.generateAsync({ type: "blob" });
            const url = URL.createObjectURL(content);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Viziahub_Cloud_Project.zip';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
