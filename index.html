<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viziahub Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-5">

    <div class="max-w-md mx-auto bg-gray-800 p-6 rounded-xl shadow-xl">
        <h1 class="text-xl font-bold mb-4">Viziahub Pro</h1>
        <button onclick="document.getElementById('settings').classList.toggle('hidden')" class="w-full bg-gray-700 p-2 mb-4 rounded">⚙️ API Settings</button>
        
        <div id="settings" class="hidden mb-4">
            <input type="password" id="apiKey" placeholder="Enter Groq API Key" class="w-full p-2 text-black rounded mb-2">
            <button onclick="saveKey()" class="w-full bg-blue-600 p-2 rounded">Save Key</button>
        </div>

        <textarea id="prompt" class="w-full h-32 p-2 text-black rounded mb-4" placeholder="App idea..."></textarea>
        <button id="buildBtn" onclick="runBuild()" class="w-full bg-green-600 p-4 rounded font-bold">🚀 Build App</button>
        <button id="dlBtn" disabled onclick="downloadFile()" class="w-full mt-2 bg-gray-500 p-4 rounded font-bold">📥 Download</button>
        <p id="msg" class="mt-4 text-xs text-gray-400 text-center">Ready</p>
    </div>

    <textarea id="hiddenCode" class="hidden"></textarea>

    <script>
        function saveKey() {
            localStorage.setItem('groq_key', document.getElementById('apiKey').value);
            alert("Saved!");
        }
        
        document.getElementById('apiKey').value = localStorage.getItem('groq_key') || '';

        async function runBuild() {
            const btn = document.getElementById('buildBtn');
            const msg = document.getElementById('msg');
            const key = localStorage.getItem('groq_key');
            
            if(!key) return alert("API Key missing!");
            
            btn.innerText = "Building...";
            msg.innerText = "Processing...";

            try {
                const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": "Bearer " + key, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [{role: "system", content: "Write only valid HTML/Tailwind code. No markdown, no intro."}, {role: "user", content: document.getElementById('prompt').value}]
                    })
                });
                const data = await res.json();
                const code = data.choices[0].message.content.replace(/```html|```/g, "");
                document.getElementById('hiddenCode').value = code;
                document.getElementById('dlBtn').disabled = false;
                document.getElementById('dlBtn').className = "w-full mt-2 bg-green-700 p-4 rounded font-bold";
                msg.innerText = "Done!";
            } catch(e) {
                msg.innerText = "Error: " + e.message;
            }
            btn.innerText = "🚀 Build App";
        }

        function downloadFile() {
            const blob = new Blob([document.getElementById('hiddenCode').value], {type: 'text/html'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = "app.html";
            a.click();
        }
    </script>
</body>
</html>
